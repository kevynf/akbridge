name: AKBridge automated validation and maintenance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --extra dev --python "${{ matrix.python-version }}"
      - name: Run deterministic tests
        run: uv run --no-sync python -m pytest -q

  offline-contract:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The checked-in manifest is generated with the repository's canonical
      # interpreter. Keep annotation rendering stable for strict comparison.
      UV_PYTHON: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --extra dev --python "3.14"
      - name: Run offline per-interface acceptance
        run: >-
          uv run --no-sync akbridge-accept run --offline --workers 4
          --output artifacts/acceptance/runs/offline.json
      - name: Build distributable package
        run: uv build
      - name: Check catalog and MCP contract
        run: >-
          uv run --no-sync akbridge-maintain ci --strict
          --baseline artifacts/acceptance/manifest.json
          --current artifacts/maintenance/manifest.json
          --catalog artifacts/catalog.json
          --report artifacts/maintenance/latest.json
          --check-latest
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: akbridge-maintenance-report
          if-no-files-found: ignore
          path: |
            artifacts/maintenance/
            artifacts/acceptance/runs/
      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: akbridge-distributions
          path: dist/
