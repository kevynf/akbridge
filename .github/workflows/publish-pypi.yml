name: Publish AKBridge to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --extra dev --extra release --python "3.11"
      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          runtime_version="$(uv run --no-sync python -c 'import akbridge; print(akbridge.__version__)')"
          if [[ "${runtime_version}" != "${package_version}" ]]; then
            echo "Runtime version ${runtime_version} does not match package version ${package_version}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${package_version}." >&2
            exit 1
          fi
      - name: Run deterministic tests
        run: uv run --no-sync python -m pytest -q
      - name: Run offline per-interface acceptance
        run: >-
          uv run --no-sync akbridge-accept run --offline --workers 4
          --output artifacts/acceptance/runs/offline.json
      - name: Build version-matched AKShare documentation index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          akshare_version="$(uv run --no-sync python -c 'import akshare; print(akshare.__version__)')"
          akshare_tag="release-v${akshare_version}"
          akshare_ref="$(gh api "repos/akfamily/akshare/commits/${akshare_tag}" --jq .sha)"
          uv run --no-sync akbridge-docs build \
            --ref "${akshare_ref}" \
            --output src/akbridge/data/akshare-docs.json
          uv run --no-sync python -c \
            "import akshare; from akbridge.documents import load_builtin_document_chunks; assert load_builtin_document_chunks(expected_version=akshare.__version__)"
      - name: Build package
        run: uv build
      - name: Verify distributions include the documentation index
        shell: bash
        run: |
          unzip -l dist/*.whl | grep 'akbridge/data/akshare-docs.json' >/dev/null
          tar -tzf dist/*.tar.gz | grep 'src/akbridge/data/akshare-docs.json' >/dev/null
      - name: Check package metadata
        run: uv run --no-sync twine check dist/*
      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/akbridge
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Wait for PyPI metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..24}; do
            metadata="$(curl --fail --silent --show-error \
              "https://pypi.org/pypi/akbridge/${version}/json" || true)"
            if [[ -n "${metadata}" ]] && \
              jq -e --arg version "${version}" '.info.version == $version' <<<"${metadata}" >/dev/null && \
              jq -e '.info.description | contains("mcp-name: io.github.kevynf/akbridge")' \
                <<<"${metadata}" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "PyPI metadata for akbridge ${version} was not ready in time." >&2
          exit 1
      - name: Install MCP publisher
        shell: bash
        run: |
          curl --fail --location \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
