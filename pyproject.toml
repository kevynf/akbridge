[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akbridge"
version = "0.1.0"
description = "Complete, automatically discovered MCP access to AKShare"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["akshare", "mcp", "finance", "market-data", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "akshare==1.18.81",
  "mcp==1.8.1",
  "pandas>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/kevynf/akbridge"
Repository = "https://github.com/kevynf/akbridge.git"
Issues = "https://github.com/kevynf/akbridge/issues"
Documentation = "https://github.com/kevynf/akbridge#readme"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]

[project.scripts]
akbridge = "akbridge.server:main"
akbridge-accept = "akbridge.acceptance:main"
akbridge-maintain = "akbridge.maintenance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/akbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep temporary files in the workspace.  This makes the automated test suite
# independent of a locked or enterprise-managed system temp directory.
addopts = "-q --basetemp=.pytest-tmp/pytest"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
